name: Build desktop and Android clients

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "HTTPS URL of the OpenRig API (for example https://api.example.com)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure API endpoint
        shell: pwsh
        run: |
          @"
          window.OPENRIG_CONFIG = { apiUrl: "${{ inputs.api_url }}" };
          "@ | Set-Content -Path public/openrig-config.js -Encoding utf8
      - name: Install dependencies
        run: npm install
      - name: Build Windows installers
        run: npm run tauri:build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: openrig-windows-installers
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Configure API endpoint
        run: |
          cat > public/openrig-config.js <<'EOF'
          window.OPENRIG_CONFIG = { apiUrl: "${{ inputs.api_url }}" };
          EOF
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npm run mobile:sync
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: openrig-android-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
